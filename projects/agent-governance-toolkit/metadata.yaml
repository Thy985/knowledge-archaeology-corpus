## 关键认知（可复用）

- **KO-01** 分层防御：粗粒度前置门（ring）+ 细粒度授权（policy），被拒请求不消耗决策资源
- **KO-02** 治理决策确定性分层：核心授权确定性（无 LLM 在批准路径），非确定性层只有"阻止权"（advisory block-only，失败默认 allow）
- **KO-03** 信任沿委托链单调收敛（trust ceiling），子代理 ≤ 父代理，防提权
- **KO-04** 审计可证明性：哈希链+Merkle 树防篡改 → Decision BOM 可重构 → TRACE 信任记录
- **KO-05** 治理失败模式必须可见：fail-closed 优于 fail-open（可见性驱动修正）
- **KO-06** 治理栈从 OS 借力（执行环/SRE/供应链/威胁建模）是 AGT 全栈参考实现选择

