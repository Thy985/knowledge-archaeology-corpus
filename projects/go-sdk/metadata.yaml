summary: |
  MCP 官方 Go SDK 的初始考古。核心发现：2026-07-28 协议无状态化不是"删掉会话"，而是把
  会话生命周期压到单次请求（KO-02）；客户端用 discover-first + fallback 完成代际迁移（KO-01）；
  版本事实分布在 header/_meta/握手三个平面（KO-04）；会话身份绑定是有状态路径的传输层不变量（KO-03）；
  初始化门禁在请求路径上被注释（KO-05，fail-open）；重放依赖"不得部分重放"存储契约（KO-06）；
  服务器主动请求被折叠为 InputRequests（KO-07）；缺口被写成 conformance baseline / rough_edges（KO-08）。
  KO-01~KO-08，其中 KO-02/KO-05 为 L4，其余 L3；全部标 Cross-project validation pending。
