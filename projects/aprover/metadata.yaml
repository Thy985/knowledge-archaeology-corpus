# aprover — Archaeology Corpus Entry

## 项目定位
**AProver（Agentic Prover for AI-Generated Code）**：LLM 驱动的形式化验证 agent 套件；首个 agent BMC-Agent 是 *agentic model checking* 原型——LLM agent（spec 生成/反例分类/spec 精化）+ 健全 BMC 后端（CBMC/Kani/JBMC）配对。设计原则 "agents propose, conventional tools dispose"：LLM 的每个健全性相关决策必须经传统检查（CBMC 查询/SMT 守卫/运行时复现）才能影响验证结论。参考论文 *Agentic Model Checking*（arXiv:2605.21434, 2026）。

