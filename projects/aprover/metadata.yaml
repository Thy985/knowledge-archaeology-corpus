## 关键发现（五条）
1. **删除不对称性**：从报告静默删除真实 bug = 健全性损失（假阴性），错误保留只是精度损失——健全性只要求 "no real bug silently removed"。
2. **智能 ≠ 权威（验证语境）**：AGENTIC_JUDGMENT（LLM 判定）永不可作为唯一删除依据，只可 RETIER；删除只授权给确定性验证器（CBMC）或自验证证人（编译+精确复现）。
3. **证据分级 = 信任分层**：confirmed_dynamic ＞ confirmed_system_entry ＞ confirmed_bmc ＞ likely ＞ unlikely；realism 审计降档保留审计轨迹，confirmed_dynamic 免疫降档（main.assertion.N 例外）。
4. **确定性短路替代 LLM**：realism witness-pattern（未初始化库/jv stub-disconnect/NULL-guard/USB-serial 框架不变量）在 LLM 前确定性判定，省往返且防 LLM 创造性合理化人为产物。
5. **实测**：VibeOS 37 模块 13 真实 bug（滤 48 不真实）；llm.c 22/30 函数 clean（首次 BMC 应用于真实 ML 训练程序）。

