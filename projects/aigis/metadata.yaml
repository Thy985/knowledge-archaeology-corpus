## 关键认知（可复用）

- **KO-01** 当后果不可逆时，判定的可解释性优先于判定覆盖面（确定性规则 vs LLM judge 双路线）
- **KO-02** 防御层的价值在于失效模式的正交性，而非层数本身
- **KO-03** 不可抵赖性是设计目标也是测试断言——没有测试的防篡改只是愿望
- **KO-04** 安全工具的依赖面即其攻击面（零依赖 + MCP trust score + 对抗循环）

### 主仓库 run（ARCH-2026-09-27-001）核心认知增量

- **KO-01（主）** 编码/变体攻击的防御必须"先还原再匹配"（归一化→解码→重扫全量）
- **KO-02（主）** 信任分层：宿主静态权限门 + hook 动态策略门 + 审计第三轨（条件规则只能活在能评估条件的层）
- **KO-03（主）** taint 先于授权：UNTRUSTED 数据无条件禁止驱动控制流工具（即使有 grant）——⚠️ Partially validated（CaMeL 层无测试覆盖）
- **KO-04（主）** 防篡改审计 = 签名 + 覆盖含签名字段的哈希链，且审计失败不反噬决策
- **KO-05（主）** 诚实性设计：自有合规编号明示非官方、不利基准照实呈现
- **KO-06（主）** 战略测量纪律：错误 KPI 使路线图漂移（54★ vs 1000 目标）；退出清单与目标清单同等重要
- **KO-07（主）** 发布时序硬约束防级联烧号（PyPI v2.0.0/v1.1.1→v1.1.3 教训）

