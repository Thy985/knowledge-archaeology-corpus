# aigis — Archaeology Corpus Entry

## 项目定位
确定性、零依赖的 AI Agent 运行时防火墙：每次工具调用前跑检测管线，产出可解释 allow/deny + HMAC 签名防篡改审计日志；覆盖 MCP rug-pull、记忆投毒、间接注入、外泄通道；带合规模板。**本条目含两个考古 Run，对象不同**：

- **ARCH-2026-09-13-001（fork）**：`pyaigis-kr fork`（gaebalai/aigis-kr，v1.1.4，韩国 PIPA/ISMS-P/금융위 聚焦，早期镜像，能力文档指向原版架构）。
- **ARCH-2026-09-27-001（主仓库）**：`killertcell428/aigis`（pyaigis v2.0.1，HEAD 5874cbb5）——主仓库真身（fork 是早期镜像）。v2.0.1 检测管线为 **L1-L4**（regex→语义→主动解码重扫→CaMeL 能力访问控制），战略收缩为"让 Claude Code 等自主 agent 通过日本企业内部安全审查"（経産省 AI 事业者指南/ISO 27001/NIST AI RMF/OWASP LLM Top 10 映射，trust pack 从实时配置生成 EN/JA 审批包）。

