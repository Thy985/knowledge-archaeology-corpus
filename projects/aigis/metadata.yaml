# aigis — Archaeology Corpus Entry

## 项目定位
确定性、零依赖的 AI Agent 运行时防火墙：每次工具调用前跑 L1-L7 检测管线（正则/语义/解码/CaMeL taint/沙箱/安全规约/FSM），产出可解释 allow/deny + HMAC 签名防篡改审计日志；覆盖 MCP rug-pull、记忆投毒、间接注入、外泄通道；带 12 合规模板（本 fork 聚焦韩国 PIPA/ISMS-P/금융위）。本条目考古的是 **pyaigis-kr fork**（gaebalai/aigis-kr，v1.1.4），能力文档指向原版 Aigis 架构。

