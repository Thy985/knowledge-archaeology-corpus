## 关键认知（可复用）

- **KO-01** 当后果不可逆时，判定的可解释性优先于判定覆盖面（确定性规则 vs LLM judge 双路线）
- **KO-02** 防御层的价值在于失效模式的正交性，而非层数本身
- **KO-03** 不可抵赖性是设计目标也是测试断言——没有测试的防篡改只是愿望
- **KO-04** 安全工具的依赖面即其攻击面（零依赖 + MCP trust score + 对抗循环）

