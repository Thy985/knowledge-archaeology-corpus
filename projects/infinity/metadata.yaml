summary: >-
  infinity（Rust，Apache-2.0，★468，2026-04-13 created，2026-10-29 pushed，21 crates / 168 .rs /
  57,187 行）——AWS×UC Berkeley Hydro 项目，"大规模并发 agent 运行时"。核心命题：stackless
  coroutine 语义搬到 agent 执行——工具调用=挂起点，历史=continuation，slice 有界执行后完全退出，
  等待中 agent 是纯数据（无 task/stack/连接）。三层架构：slice 三阶段（prepare_input→run_completion→
  execute_action）+ 同步工具 loop-back + turn buffer 先 flush 后 dispatch 持久化时序 + 幂等去重
  （processed IDs for User/SubscriptionEvent + history tail for tool results）+ FIFO per thread
  （SQS FIFO MessageGroupId / mpsc）+ synthetic tool calls（receive_event__injected）+ deferral
  （NoDeferral/InMemoryDeferQueue）+ compaction（>75% context，按 history index 重建）+ 错误分类
  （ErrorClass Transient/Throttled/ContextOverflow/Fatal provider 自声明）+ 平台 4-trait
  （ConversationStore/StateStore/InputSender/HttpClient）→ Lambda（DSQL+DynamoDB+SQS 同队列回环）
  与 daemon（in-memory+JSON）双生产实现。benchmark（CHANGELOG 自述 S3-S4）：50k agents × 20 turns
  = 2M completions / 255 s / 7.9 GB RSS / ≈154 KB per idle agent。
  本次考古产出 50 EK（EK Graph 六类边，平均出边 ≥2，聚合覆盖率 100%）/ 9 KO（R1×3 R2×3 R3×1 R4×2，
  L3×4 L4×5，9 条 Cross-project validation pending）/ 7 类 Flow / 9 Candidates（跨项目假说 C-01：
  挂起-恢复 vs 步骤重放资源经济学；C-07：RAP vs MCP 生态）。
  独立审计（盲重建 event_processor/tools/mod/thread/rap_tool/mcp-bridge/provider-remote/agent_scale/
  architecture/step-mode）10 CONFIRMED + 1 PARTIALLY_CONFIRMED（MCP bridge 机制描述：实际是 McpToolSet
  把 MCP 服务器暴露为本地 tools 而非"协议兼容直跑"）+ 4 MISSING（close_thread root 禁令 / 订阅线程
  报告前缀 / Tool trait 6 方法+Rhai display / provider Unix socket 传输）+ 1 精确化（幂等 ID 仅覆盖
  User+SubscriptionEvent）。Reconciliation 合并 5 项修正（EK-29 重写 + EK-46~50 补充）。核心命题全部
  CONFIRMED，无 DOWNGRADED / CONTRADICTED。Corpus 连接：temporal/restate/dbos-transact-py/
  dapr-agents/substrate（步骤重放派对照，Infinity=挂起-恢复派）。

