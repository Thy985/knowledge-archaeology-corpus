schema: knowledge-archaeology/flow-atlas@3.1
project: chrome-devtools-axi
run_id: ARCH-2026-11-26-001
flows:
- id: control
  title: Control Flow
  summary: 从短命 CLI 到 MCP tool 的控制链。关键分支是“复用 vs 重启”和“gate 通过 vs 403”。
  edge_count: 8
  runtime_verified: false
- id: state
  title: State Flow
  summary: 跨命令状态：PID/port、selected page、generation、identity epoch。每条边都改变下一次命令可观察的行为。
  edge_count: 7
  runtime_verified: false
- id: data
  title: Data Flow
  summary: 参数、roots、MCP 结果、错误和文件路径的数据变换。注意 `/call` 没有通用 schema 校验。
  edge_count: 7
  runtime_verified: false
- id: evidence
  title: Evidence Flow
  summary: 快照证据链：页面 -> uid stamp -> action -> freshness gate -> 响亮失败。
  edge_count: 7
  runtime_verified: false
- id: authority
  title: Authority Flow
  summary: 谁能触发、能触达什么权限。Host/Origin 与 caller identity 是两个不同边界。
  edge_count: 7
  runtime_verified: false
- id: memory
  title: Memory Flow
  summary: 文件即控制面内存：bridge.pid、selected-page-id、snapshot-generation、session 目录。
  edge_count: 6
  runtime_verified: false
- id: policy
  title: Policy Flow
  summary: 仓库治理：CI、airlock、生成文件 guard、release provenance。
  edge_count: 6
  runtime_verified: false
