## 关键发现（五条）
1. **确定性审批循环**：ToolApprovalMiddleware 是会话内审批状态机（函数调用预算 + 自动批准队列 + 二次审批 + pending 逃生舱），循环直到全部工具调用被批准或转交人类。
2. **FIDES 标签即权威**：Integrity/Confidentiality 标签三级传播（内嵌 > source_integrity > 输入/默认），untrusted 内容物理隔离（变量间接）+ 隔离执行（quarantine）——提示注入防御是确定性信息流控制，不是 prompt 工程（ADR 0024）。
3. **记忆注入是安全决策**：Cosmos 用户摘要以 untrusted user 角色注入（非 instructions），防存储提示注入（poisoned summary 不得成为持久高优先级指令）。
4. **循环受控坚持**：max_iterations 安全上限先于语义谓词短路 + fresh_context session 快照重置 + 结构化停止谓词（todos/后台任务）。
5. **CodeAct 沙箱边界**：模型写可执行代码在 Hyperlight 沙箱执行，模型代码相对宿主 untrusted；"后端若无匹配信任模型的隔离能力则非合适 CodeAct 后端"（ADR 0038）。

