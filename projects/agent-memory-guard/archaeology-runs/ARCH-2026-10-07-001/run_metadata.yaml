key_findings:
  - 默认 permissive：无参 MemoryGuard 只检测不拦截（Policy.permissive）；strict/tiered 才主动执行
  - 深度边界闭环：#135 截断防 RecursionError → #151 超出深度变 size_anomaly finding（不可检查=发现）
  - 信任梯度：untrusted 类（retrieved_fact/tool_observation）永不晋升 policy/verified；verified=True 用户 opt-in
  - trust-aware decay：#124 后默认仅 SYSTEM 可衰减自增强冷却（source_class 不认证主体）
  - 诚实边界：Snapshot.digest 永不验证；compliance-mapping 数字全部解析到 artifact 并声明非自适应对手度量
  - AMSB：model-free canary 判定 + benign FP 惩罚 + critical 封顶 C/D + 自提交标记

