key_findings:
  - 默认 permissive：无参 MemoryGuard 只检测不拦截（Policy.permissive）；strict/tiered 才主动执行
  - 默认 7 检测器套件不含 memory_persistence_injection——ASI06 延迟生效持久化指令在官方推荐 enforcing 配置（strict）下不设防（AMSB 实测 4/4 breach），hardened 才全防线（1/15）
  - 深度边界闭环：#135 截断防 RecursionError → #151 超出深度变 size_anomaly finding（不可检查=发现而非静默）
  - 信任梯度：untrusted 类（retrieved_fact/tool_observation）永不晋升 policy/verified；verified=True 用户 opt-in（guard.promote 门）
  - trust-aware decay：#124 后默认仅 SYSTEM 可衰减自增强冷却（source_class 不认证主体）
  - 诚实边界族：Snapshot.digest 永不验证（forensics only）；compliance-mapping 数字全部解析到 artifact、声明非自适应对手度量；strict/hardened 对照设计故意暴露默认配置缺口
  - AMSB：model-free canary 判定 + benign FP 惩罚（全拒不是防御）+ critical 封顶 C/D + 自提交标记
  - 集成：LangChain/OpenAI Agents（HITL）/AutoGen/agno/CrewAI/LlamaIndex/mem0/LangGraph + OTel + MCP + CI（GitHub Action env 防注入 #122）

