summary: >-
  OWASP 官方 Incubator 的运行时记忆防御中间件（ASI06 Memory Poisoning 参考实现，MITRE ATLAS
  AML.T0080.000 引用）。Guard 插在 agent 与 memory store 之间：12 检测器（默认启用 7 个）+
  声明式 YAML 策略（permissive/strict/tiered）+ 六类分类晋升图（untrusted 永不晋升 policy）+
  SHA-256 完整性基线 + SecurityEvent 事件流（receipt_uri 外部审计链）+ AMSB 可判定基准 +
  MCP server / scanner / semgrep / SARIF / GitHub Action + NIST AI RMF & EU AI Act 合规映射。
  核心认知：记忆写入是状态变更必须过判定门；检查范围本身是安全属性（#135→#151 深度边界闭环）；
  fail-open 必须可见（#138）；信任提升只能经显式验证边（#124 trust-aware decay）。

