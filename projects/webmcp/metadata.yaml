summary: >-
  WebMCP（webmachinelearning/webmcp @ a768d04，CG-DRAFT，18 tracked files / 3,922 lines）
  是一个“规范 + explainer + 实现状态”仓库，不是运行时实现。它把网页自身功能声明为结构化工具，
  供页内 agent 与浏览器内置 agent 调用；规范只定义注册、发现、跨源暴露、执行、取消、错误映射的
  结构边界，明确不规定 intent 验证、用户同意、JSON Schema 校验或 agent guardrail。
  核心张力：页内 API 有三道跨源门（tools policy + exposedTo + fromOrigins），但内置 agent 走
  非规范性 observation，直接收集全部 descendant documents 的 tool map，不做同样的过滤。
  本次产出 30 EK / 19 KO（5 L1 + 6 L2 + 5 L3 + 2 L4 + 1 L5）/ 7 flows / 55 edges /
  14 candidates。独立审计 30 项：24 CONFIRMED、3 PARTIALLY_CONFIRMED、1 DOWNGRADED、
  1 CONTRADICTED（错误分类被压成“五类含 InvalidStateError”）、1 MISSING
  （service worker 的 self.modelContext 与 [Exposed=Window] 未对齐）。Gate = PARTIAL；
  无 WPT 运行、无浏览器 trial、无外部实现源码审计。

