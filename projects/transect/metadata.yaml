key_findings:
  - "judge 标签不可信被作为第一性设计约束：digest→判定→投票→verifier→narrator→可靠性度量的校正闭环"
  - "每个标签携带 anchor_event_id + judge-identity 列，可深链回源头回合（溯源不变量）"
  - "对高自洽度设防：KROLL_SUSPICIOUSLY_HIGH=0.95 amber（cache 重放/共享 prompt/名称锚定）；spot-check overturn 必 red"
  - "自洽性 ≠ 正确性；同模型 verifier 二轮 ≠ 可重复性度量（显式 caveat）"
  - "判定权威分层：cohort 多数投票即校正（verifier 强制 off）；narrator 永不改标签"
  - "与 AgentJudgeBench（ARCH-2026-10-12-001）构成评测可信度双环（judge 审计层 + 结果可观测层）"
key_controversies:
  - "verifier overturn gate 0.6 与 random_sample 5% 为启发式阈值，无基准化验证（C-02）"
  - "cohort α 高一致性未设防（相关 judge ≠ 精确，C-03）"
  - "报告从未声称 phase 分割正确（narration_group_status 只描述坐标完整性，C-05）"
