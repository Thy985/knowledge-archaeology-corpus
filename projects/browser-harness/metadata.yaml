summary: >-
  0.1.15 refresh of browser-harness: the daemon now has tab-level ownership (tab_owner,
  session_owner, GUARDED Target.attachToTarget/closeTarget/activateTarget, iframe proof,
  URL/title blanking, idle release, owner state persistence). Old C-02 is partially resolved:
  a tab mutex exists and is unit-tested, but ownership is a cooperative routing label, not
  authentication; browser-level CDP sessions (`Target.attachToBrowserTarget`) are not
  owner-bound; a sub-agent without `BH_OWNER` can still drive the parent's current tab via
  `cdp()`, while only `close_tab`/`release_tabs` are refused. browser-use 1.0.8 pins
  `browser-harness==0.1.13`, has zero owner-API usage, and gives each non-shared Browser its
  own daemon; the shared `Browser('chrome')` path carries no owner identity, so the upstream
  owner model is not in force downstream. Independent audit: 79 CONFIRMED, 7 PARTIALLY_CONFIRMED,
  1 DOWNGRADED (KO-09 L4 -> L3), 1 OVER_GENERALIZED (EK-10 warning frequency), 6 MISSING,
  3 CONTRADICTED (a quoted README sentence absent from the snapshot; test-file count), 3
  NEEDS_HUMAN_REVIEW (browser-level exploit, sub-agent host behavior, cross-project daemon
  identity). Skill Evolution not triggered; no systemic skill defect proven this run.
