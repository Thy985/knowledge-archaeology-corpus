summary: >-
  PoEM (Proof-of-Execution Memory) is a FARMA-reproduction research artifact plus an IEEE Access
  paper draft. Its core claim is that a memory-based agent should not treat a natural-language claim
  ("the step was already done") as authority; it should require an event in a separate, HMAC-chained
  execution ledger. The harness implements ReasoningMemory (unsigned/free text) and ExecutionLedger
  (HMAC-SHA256 chain over action|subject|step|prev), and a decision gate that vetoes one configured
  unsafe action when the safety step is absent from the ledger. Six defenses are compared across
  three scenarios and two attack families. The repository contains no unified test suite and no
  packaging metadata; verification is research scripts plus JSON/Markdown result tables.

