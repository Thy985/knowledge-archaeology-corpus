key_findings:
  - "Two physically separate stores: ReasoningMemory holds claims; ExecutionLedger holds HMAC-chained execution events. PoEM's gate reads the ledger, not the memory."
  - "The gate is narrow: it checks only the configured unsafe action against one safety_step+subject. Out-of-scope actions pass through (policy_test Part B reproduces export_to_partner escaping a narrow gate set)."
  - "Proof identity is (action, subject) only. NaivePoEM accepts any event with the safety_step, so cross-subject replay defeats it; PoEM's subject+chain check blocks that path (attack_poem.py, mock)."
  - "HMAC chain proves byte order under a key, not write authority. The default key b'trusted-runtime-key' lets anyone who reads the source mint a valid chain; record() and clear() are public; duplicate/out-of-order events still verify (EK-49)."
  - "Chain verification is O(N): measured 18.3 us at N=10, 1.74 ms at N=1,000, 173.8 ms at N=100,000. The paper's microsecond wording holds only at small N."
  - "Sentinel is a lexical score; the LangChain port strips EXTERNAL provenance and hardcodes AGENT, so ported SENTINEL is not equivalent to the harness version (EK-47)."
  - "Experimental claims are S3 author-recorded: GPT-4o/4o-mini adaptive ASR 94-100%, Llama-3.1-8B 40-56%, PoEM 0%. No live model was rerun here; no Ollama/OpenAI key was available."
  - "No unified test suite or packaging; mock numbers are explicitly a plumbing demonstration, not scientific results. Real-model reproduction remains open."

key_controversies:
  - "KO-02 and KO-05 were initially promoted to L4 candidates; Independent Validation downgraded both to L3 because the evidence is one prototype plus deployment inference / conceptual comparison."
  - "KO-09 (model-capability-vs-ASR) is an L2 Observation needing human review; the result files are author-produced and the mock harness cannot test the claim."
  - "Trial pairing: clean and poisoned trials are separate stochastic runs paired by index, which can bias ASR (EK-46)."
  - "attack.py defines 3+7 variants, but experiment.py imports scenarios.py variants only; the published matrix must be attributed to scenarios.py (EK-45)."
  - "safe-step accounting records that the safe action was selected, not that the real tool succeeded; the paper's threat model and harness abstraction leave this open."

