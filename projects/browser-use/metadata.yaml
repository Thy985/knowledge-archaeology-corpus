summary: >-
  browser-use 1.0.8 是对 0.13.10 的架构级重写，不是 feature refresh：模型不再从 DOM/action schema 里选动作，
  而是在一个持久 Python REPL 里写代码，通过 browser-harness helpers 与 raw CDP 驱动浏览器。
  本轮产出 55 EK / 12 KO（10 L3 Pattern + 2 L4 Cognitive Model，0 L5）/ 7 类 Flow / 59 条 Flow Edge /
  13 Candidates；964 个非 Chrome 测试通过（3 skipped / 140 deselected）。
  关键认知：1) 代码即动作空间后，治理从 action schema 层转移到 parent/worker/daemon 执行面、browser attach/domain 面、
  以及 budget/delivery 面；2) redaction 不是 sandbox，domain allowlist 不是网络隔离，local debug port 是未认证的
  loopback authority grant；3) agent 的 finish(success=...) 与 judge 是两条并列通道，is_successful() 只读前者，
  judge 是同一模型的第二次请求而非独立验证；4) 失败降级是固定阶梯（cell deadline → delivery deadline →
  delivery-only turn → partial checkpoint），保交付物而非保 Python 变量。

key_findings:
  - KO-01 代码即动作：无 DOM serializer / 无 action schema；built-ins 只有 python / finish / finish_from_repl
  - KO-02 三平面执行：parent 持 key/budget/delivery；worker 以用户身份跑代码、可被杀/重启；daemon 持浏览器、可跨进程存活
  - KO-03 预算→交付阶梯：90% 预算进入 delivery-only，cell timeout 杀进程树，文件/浏览器状态保留、Python 变量丢失
  - KO-04 交付是结构契约：split delivery / placeholder / missing file 各修一次；但只校验结构，不校验语义
  - KO-05 两条 verdict：is_successful() 只读 agent success；judge 同模型、同 trace，cached path 还共享 prefix，不独立
  - KO-06 redaction ≠ isolation：worker 可读用户文件、parent .env、/proc/<pid>/environ；截图/js() 不 redact
  - KO-07 domain allowlist ≠ 网络隔离：只拦 main-frame document；iframe/subresource/Python HTTP 不过滤
  - KO-08 local debug port = ambient authority：127.0.0.1、无 token、同机账户可 attach；profile copy 带 cookies
  - KO-09 双 compaction 路径：server-side LazyCompaction vs client-side summary checkpoint + 20/2 image prune
  - KO-10 managed cloud 是默认运行时：Browser() cloud + bu-4.0 + 单 key；local 是显式 opt-in
  - KO-11 (L4) action space 决定治理面：typed action → action-level policy；code action → OS/process/browser/budget policy
  - KO-12 (L4) 四类边界易混淆：confidentiality / execution containment / navigation policy / authority grant

