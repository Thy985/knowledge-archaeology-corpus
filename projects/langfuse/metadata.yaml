## 核心认知
**"可观测性平台 = 语义适配 + 事件化存储 + 可治理的执行管道"**：Langfuse 用 OTel 适配层把异构 trace 归一为内部模型（注册表适配器 + 词表保守映射），用事件化管道保证摄取可靠（确定性采样/跨日延迟/失败可见），用 DecisionModel + 治理门让"评估"成为可暂停、可审计、可规格化的工程对象。

## 关键发现（Top 5）
1. OTel 外部语义（level 词表/类型/属性）经 ObservationTypeMapper 注册表（priority 排序）+ 词表保守映射归一化为内部 Observation 模型，未知值显式降级不掩盖
2. eval 规格化为 DecisionModel 结构化问题集（CHOICE/SCORE/NOUL + 概率输出 + 严格答案校验写回），而非自由文本 prompt
3. EvalRule 治理门三层：ACTIVE + blockedAt；MANUAL 绕过 live toggle 但不绕过 blocked（"可暂停的自动化"）
4. eval 执行带 LLM 重试预算：retryable → job_executions DELAYED 120min + 确定性 executionTraceId；rate limit → BullMQ exp backoff
5. 供应链四层治理：pnpm 5 天新依赖延迟 + allowBuilds 白名单（prisma CLI 禁 build 但 @prisma/client 允许）+ CVE 钉死 + 4 个上游未修 patchedDependencies

