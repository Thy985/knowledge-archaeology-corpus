# langfuse — Archaeology Corpus Entry

## 项目定位
**Langfuse 是开源 LLM 工程平台**（v4.48.0，MIT，TypeScript monorepo，35k★）：以 OpenTelemetry GenAI 语义约定为摄取基线的 trace / evaluate / improve 一体平台——外部 OTel span 经适配层归一化为内部 Observation 模型，事件化写入 ClickHouse；eval 系统以 DecisionModel（结构化问题定义）为规格、LLM-as-judge/代码 eval 为执行体、LIVE/MANUAL + blocked 规则为治理门；worker 侧以 25+ BullMQ 队列异步执行全部耗时路径。Corpus 27 项中无 LLM 可观测性平台类，本轮填补主题空白。

