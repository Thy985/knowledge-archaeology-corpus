## 关键发现（五条）
1. **Code-as-Action**：动作空间 = 自由形式 Python/bash 脚本而非单步 DOM 操作预测；模型越强，程序化动作面越优于"一步一预测"的交互 loop（README Motivation 原证）。
2. **验证门而非自裁**：`require_self_reflection_success=true` 时 done 被硬阻塞（五种阻塞分支），直到外部两阶段图片判定器给出 `predicted_label==1`；**执行与完成判定权分离**。
3. **零 token 技能复用（Skill Factory）**：solve 脚本经 gate 准入 → learn/update 蒸馏为参数化程序技能 → route 三决策（run 零模型 ~40s / adapt 注入 prior / skip）；WebArena held-out 55%→70%（README 声明，Observation 级）。
4. **双状态模型一个 loop**：workspace（磁盘态+外部门）与 live browser（会话态+模型自判）共用 DefaultAgent，差异收敛于 config；完成判定严格度随状态模型变化（KO-08）。
5. **极简 footprint 达 SOTA 声明**：核心 loop 467 行 / Playwright env 567 行 / CLI 175 行，9 项依赖零编排框架；Online-Mind2Web 86.7% / Odysseys 60.1%（README 声明）。

## 关键争议
- 基准数字（86.7%/60.1%/55→70%）为 README 声明，本考古未实测复现（无模型 key）——标 Observation（C-05）。
- live-browser 模式无外部门（模型自裁完成），插件模式（四宿主）门控强度静态不可证（C-06 Hypothesis）。
- 独立 Auditor DOWNGRADED：KO-01/KO-08 完成判定结论已收紧为"门强度绑定状态模型"的显式对照。

