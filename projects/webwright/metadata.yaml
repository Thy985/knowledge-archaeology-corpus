# webwright — Archaeology Corpus Entry

## 项目定位
**Webwright（microsoft/Webwright）**：Terminal-Native Web Agent —— 把"写代码控制浏览器"作为动作面（code-as-action），本地工作区（脚本+截图+日志）作为状态（workspace-as-state），浏览器只是可丢弃环境。核心主张：**你的 web agent 浏览历史是一个可重跑的 Python 文件**。参考论文《Webwright: A terminal is all you need for web agents》(Lu, Xu, Huang, Awadallah, 2026)。

